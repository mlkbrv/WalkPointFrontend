openapi: 3.0.3
info:
  title: WalkPoint API
  version: 1.0.0
  description: Walk-to-Earn backend API
paths:
  /api/activity/convert/:
    post:
      operationId: activity_convert_create
      tags:
      - activity
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/activity/stats/:
    get:
      operationId: activity_stats_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - activity
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDailyStatList'
          description: ''
  /api/activity/today/:
    get:
      operationId: activity_today_retrieve
      tags:
      - activity
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/market/:
    get:
      operationId: market_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - market
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCouponTemplateList'
          description: ''
  /api/market/buy/:
    post:
      operationId: market_buy_create
      tags:
      - market
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/market/my-coupons/:
    get:
      operationId: market_my_coupons_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - market
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUserCouponList'
          description: ''
  /api/market/redeem/:
    post:
      operationId: market_redeem_create
      tags:
      - market
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/market/templates/create/:
    post:
      operationId: market_templates_create_create
      tags:
      - market
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CouponTemplateCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CouponTemplateCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CouponTemplateCreate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CouponTemplateCreate'
          description: ''
  /api/partners/leaderboard/:
    get:
      operationId: partners_leaderboard_retrieve
      tags:
      - partners
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/partners/profile/:
    get:
      operationId: partners_profile_retrieve
      tags:
      - partners
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerProfile'
          description: ''
    put:
      operationId: partners_profile_update
      tags:
      - partners
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartnerProfile'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PartnerProfile'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PartnerProfile'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerProfile'
          description: ''
    patch:
      operationId: partners_profile_partial_update
      tags:
      - partners
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedPartnerProfile'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedPartnerProfile'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedPartnerProfile'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerProfile'
          description: ''
  /api/partners/stories/:
    get:
      operationId: partners_stories_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - partners
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedStoryList'
          description: ''
  /api/partners/stories/create/:
    post:
      operationId: partners_stories_create_create
      tags:
      - partners
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoryCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/StoryCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StoryCreate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoryCreate'
          description: ''
  /api/partners/stories/view/:
    post:
      operationId: partners_stories_view_create
      tags:
      - partners
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/users/login/:
    post:
      operationId: users_login_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /api/users/profile/:
    get:
      operationId: users_profile_retrieve
      tags:
      - users
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: ''
    put:
      operationId: users_profile_update
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserProfile'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserProfile'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserProfile'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: ''
    patch:
      operationId: users_profile_partial_update
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserProfile'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserProfile'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserProfile'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: ''
  /api/users/register/:
    post:
      operationId: users_register_create
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Register'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Register'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Register'
          description: ''
  /api/users/token/refresh/:
    post:
      operationId: users_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/wallet/:
    get:
      operationId: wallet_retrieve
      tags:
      - wallet
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wallet'
          description: ''
  /api/wallet/transactions/:
    get:
      operationId: wallet_transactions_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - wallet
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTransactionList'
          description: ''
components:
  schemas:
    BlankEnum:
      enum:
      - ''
    CouponTemplate:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        partner:
          type: integer
          readOnly: true
        partner_name:
          type: string
          readOnly: true
        title:
          type: string
          maxLength: 255
        description:
          type: string
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        image:
          type: string
          format: uri
          nullable: true
        expiry_date:
          type: string
          format: date
          nullable: true
        quantity:
          type: integer
          maximum: 2147483647
          minimum: 0
        is_available:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - is_available
      - partner
      - partner_name
      - price
      - title
    CouponTemplateCreate:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 255
        description:
          type: string
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        image:
          type: string
          format: uri
          nullable: true
        expiry_date:
          type: string
          format: date
          nullable: true
        quantity:
          type: integer
          maximum: 2147483647
          minimum: 0
      required:
      - id
      - price
      - title
    DailyStat:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        date:
          type: string
          format: date
          readOnly: true
        steps:
          type: integer
          readOnly: true
        calories:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
          readOnly: true
        distance_km:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
          readOnly: true
        is_converted:
          type: boolean
          readOnly: true
        converted_steps:
          type: integer
          readOnly: true
      required:
      - calories
      - converted_steps
      - date
      - distance_km
      - id
      - is_converted
      - steps
    GenderEnum:
      enum:
      - M
      - F
      - O
      type: string
      description: |-
        * `M` - Male
        * `F` - Female
        * `O` - Other
    PaginatedCouponTemplateList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/CouponTemplate'
    PaginatedDailyStatList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/DailyStat'
    PaginatedStoryList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Story'
    PaginatedTransactionList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Transaction'
    PaginatedUserCouponList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/UserCoupon'
    PartnerProfile:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        brand_name:
          type: string
          maxLength: 255
        logo:
          type: string
          format: uri
          nullable: true
        description:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - brand_name
      - created_at
      - id
    PatchedPartnerProfile:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        brand_name:
          type: string
          maxLength: 255
        logo:
          type: string
          format: uri
          nullable: true
        description:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
    PatchedUserProfile:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        phone:
          type: string
          maxLength: 20
        avatar:
          type: string
          format: uri
          nullable: true
        bio:
          type: string
        gender:
          oneOf:
          - $ref: '#/components/schemas/GenderEnum'
          - $ref: '#/components/schemas/BlankEnum'
        height_cm:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,1})?$
          nullable: true
        weight_kg:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,1})?$
          nullable: true
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
        referral_code:
          type: string
          readOnly: true
        date_joined:
          type: string
          format: date-time
          readOnly: true
    Register:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          writeOnly: true
          minLength: 8
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        role:
          $ref: '#/components/schemas/RoleEnum'
      required:
      - email
      - id
      - password
    RoleEnum:
      enum:
      - USER
      - PARTNER
      type: string
      description: |-
        * `USER` - User
        * `PARTNER` - Partner
    StatusEnum:
      enum:
      - ACTIVE
      - REDEEMED
      - EXPIRED
      type: string
      description: |-
        * `ACTIVE` - Active
        * `REDEEMED` - Redeemed
        * `EXPIRED` - Expired
    Story:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        partner:
          type: integer
          readOnly: true
        partner_name:
          type: string
          readOnly: true
        media_url:
          type: string
          format: uri
          maxLength: 500
        reward_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
        is_active:
          type: boolean
        is_viewed:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        expires_at:
          type: string
          format: date-time
          nullable: true
      required:
      - created_at
      - id
      - is_viewed
      - media_url
      - partner
      - partner_name
    StoryCreate:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        media_url:
          type: string
          format: uri
          maxLength: 500
        reward_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
        expires_at:
          type: string
          format: date-time
          nullable: true
      required:
      - id
      - media_url
    TokenObtainPair:
      type: object
      properties:
        email:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
      required:
      - access
      - email
      - password
      - refresh
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
    Transaction:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        type:
          allOf:
          - $ref: '#/components/schemas/TypeEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - amount
      - created_at
      - id
      - type
    TypeEnum:
      enum:
      - EARN_STEPS
      - EARN_STORY
      - SPEND_COUPON
      - EARN_REFERRAL
      type: string
      description: |-
        * `EARN_STEPS` - Earn Steps
        * `EARN_STORY` - Earn Story
        * `SPEND_COUPON` - Spend Coupon
        * `EARN_REFERRAL` - Earn Referral
    UserCoupon:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        template:
          type: integer
          readOnly: true
        template_title:
          type: string
          readOnly: true
        partner_name:
          type: string
          readOnly: true
        unique_code:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        redeemed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - created_at
      - id
      - partner_name
      - redeemed_at
      - status
      - template
      - template_title
      - unique_code
    UserProfile:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        phone:
          type: string
          maxLength: 20
        avatar:
          type: string
          format: uri
          nullable: true
        bio:
          type: string
        gender:
          oneOf:
          - $ref: '#/components/schemas/GenderEnum'
          - $ref: '#/components/schemas/BlankEnum'
        height_cm:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,1})?$
          nullable: true
        weight_kg:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,1})?$
          nullable: true
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
        referral_code:
          type: string
          readOnly: true
        date_joined:
          type: string
          format: date-time
          readOnly: true
      required:
      - date_joined
      - email
      - id
      - referral_code
      - role
    Wallet:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        balance:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - balance
      - id
      - updated_at
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
