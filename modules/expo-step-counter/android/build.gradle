plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.stepcounter'
version = '0.7.10'

android {
  namespace "expo.modules.stepcounter"
  defaultConfig {
    versionCode 1
    versionName "0.7.10"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation("androidx.core:core-ktx:1.15.0")
}
